<svg class="fig" viewBox="0 0 760 210" role="img" aria-label="A radiometer sums the whole column into one number; a radar resolves the column into range bins" xmlns="http://www.w3.org/2000/svg">
          <g filter="url(#rf2)" stroke="var(--line)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
